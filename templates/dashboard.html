<!doctype html>
<html>
  <head>
    <title>MindVault</title>
  </head>
  <body>
    <h1>MindVault</h1>

    {% if user.is_authenticated %}
    <h2>Welcome, {{ user.username }}!</h2>

    <a href="{% url 'logout' %}">Logout</a>
    {% else %}
    <a href="{% url 'login' %}">Login</a>
    <a href="{% url 'register' %}">Register</a>
    {% endif %}
  </body>
</html>
